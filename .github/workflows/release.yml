name: release

# release-please drives the whole flow. On every push to main it maintains a
# release PR that bumps the version in pyproject.toml and updates CHANGELOG.
# Merging that PR is the "cut a release now" action: release-please tags THAT
# commit and creates the GitHub Release, then — gated in the same run on
# release_created — we build the sdist and wheel from the tagged commit, whose
# tree already carries the bumped version, and attach them to the Release. Tag,
# files, and artifacts are consistent by construction.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Mint a GitHub App token so the release PR is authored by the App, not
      # github-actions[bot]. PRs opened with the default GITHUB_TOKEN have their
      # CI gated behind manual "Approve and run"; an App-authored PR runs CI
      # normally.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: publish sdist & wheel
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # Check out the tagged commit — its pyproject.toml already holds VERSION.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Fail loudly if the tag and the packaged version ever drift apart.
      - name: Verify the tagged tree carries this version
        run: |
          built=$(uv version --short)
          if [ "$built" != "$VERSION" ]; then
            echo "pyproject.toml says $built but the release is $VERSION" >&2
            exit 1
          fi

      - name: Build sdist & wheel
        run: uv build

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber
