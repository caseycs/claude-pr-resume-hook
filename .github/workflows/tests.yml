name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No secrets needed: the GitHub API is stubbed in the unit tests, and the
      # integration tests only install this package into a temp uv tool dir.
      - run: uv run --python ${{ matrix.python }} pytest -q
